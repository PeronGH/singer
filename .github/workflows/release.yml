name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim

    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine release tag
        id: prepare
        run: |
          set -euo pipefail
          git fetch --tags --force

          sha="${{ github.event.workflow_run.head_sha }}"
          existing_tag="$(git tag --points-at "$sha" | grep -E '^v[0-9]+$' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max_tag=0
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v([0-9]+)$ ]] || continue
            number="${BASH_REMATCH[1]}"
            if (( number > max_tag )); then
              max_tag="$number"
            fi
          done < <(git tag --list 'v*')

          next_tag="v$((max_tag + 1))"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for cmd in sub2sing singer; do
            name="${cmd}-${{ matrix.goos }}-${{ matrix.goarch }}"
            if [[ "${{ matrix.goos }}" == "windows" ]]; then
              name="${name}.exe"
            fi
            CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
              go build -o "dist/${name}" "./cmd/${cmd}/"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  build-android:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve sing-box version
        id: versions
        run: |
          ver="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          echo "sing_box=${ver}" >> "$GITHUB_OUTPUT"

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: internal/androidvpn/kotlin/libs/libbox.aar
          key: libbox-arm64-${{ steps.versions.outputs.sing_box }}

      - name: Build libbox.aar
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.versions.outputs.sing_box }}"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:${PATH}"
          if [[ -z "${ANDROID_NDK_HOME:-}" ]]; then
            ANDROID_NDK_HOME="$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -n 1)"
            export ANDROID_NDK_HOME
          fi
          mkdir -p internal/androidvpn/kotlin/libs
          git clone --depth 1 --branch "${ver}" https://github.com/SagerNet/sing-box.git "${RUNNER_TEMP}/sing-box"
          (
            cd "${RUNNER_TEMP}/sing-box"
            gomobile bind -v \
              -o "${GITHUB_WORKSPACE}/internal/androidvpn/kotlin/libs/libbox.aar" \
              -target android/arm64 \
              -androidapi 26 \
              -javapkg=io.nekohasekai \
              -libname=box \
              -trimpath -buildvcs=false \
              -ldflags "-X github.com/sagernet/sing-box/constant.Version=${ver#v} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
              -tags "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
              ./experimental/libbox
          )

      - name: Configure Android signing and version
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ver_num="${RELEASE_TAG#v}"
          tmp="$(mktemp)"
          jq --arg v "${ver_num}.0.0" --argjson code "${ver_num}" \
            '.version = $v | .android.versionCode = $code' mygo.json > "$tmp"
          mv "$tmp" mygo.json

          if [[ -n "${ANDROID_KEYSTORE}" ]]; then
            echo "${ANDROID_KEYSTORE}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            tmp="$(mktemp)"
            jq --arg ks "${RUNNER_TEMP}/release.jks" --arg alias "${ANDROID_KEY_ALIAS}" \
              '.android.keystore = $ks | .android.keyAlias = $alias' mygo.json > "$tmp"
            mv "$tmp" mygo.json
          fi

      - name: Build Android APK
        env:
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mygo_ver="$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"
          go run "github.com/egoist/mygo/cmd/mygo@${mygo_ver}" build -platform android/arm64
          mkdir -p dist
          apk="$(find build/android -name '*.apk' | head -n 1)"
          cp "${apk}" dist/singer-android-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android-arm64
          path: dist/*

  publish:
    needs:
      - prepare
      - build
      - build-android
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-slim

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.prepare.outputs.tag }}" release-artifacts/* \
            --target "${{ needs.prepare.outputs.sha }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --latest \
            --generate-notes
