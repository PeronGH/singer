name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run linter
        uses: golangci/golangci-lint-action@v9

      - name: Run tests
        run: go test ./...

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Kotlin linters
        id: kotlin-linters-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kotlin-linters
          key: kotlin-linters-ktlint-1.8.0-detekt-1.23.8

      - name: Lint Kotlin (ktlint & detekt)
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/kotlin-linters
          if [[ ! -x ~/.cache/kotlin-linters/ktlint ]]; then
            curl -fLsS https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint \
              -o ~/.cache/kotlin-linters/ktlint
            chmod +x ~/.cache/kotlin-linters/ktlint
          fi
          if [[ ! -f ~/.cache/kotlin-linters/detekt-cli.jar ]]; then
            curl -fLsS https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar \
              -o ~/.cache/kotlin-linters/detekt-cli.jar
          fi
          ~/.cache/kotlin-linters/ktlint \
            "internal/androidvpn/kotlin/**/*.kt" \
            "internal/androidvpn/kotlin/**/*.kts" \
            "!**/*.mygo.kt"
          java -jar ~/.cache/kotlin-linters/detekt-cli.jar \
            --config .detekt.yml \
            --input internal/androidvpn/kotlin/src/main/kotlin \
            --excludes "**/*.mygo.kt"

      - name: Resolve sing-box version
        id: versions
        run: |
          ver="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          echo "sing_box=${ver}" >> "$GITHUB_OUTPUT"

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: internal/androidvpn/kotlin/libs/libbox.aar
          key: libbox-arm64-${{ steps.versions.outputs.sing_box }}

      - name: Build libbox.aar
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.versions.outputs.sing_box }}"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:${PATH}"
          if [[ -z "${ANDROID_NDK_HOME:-}" ]]; then
            ANDROID_NDK_HOME="$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -n 1)"
            export ANDROID_NDK_HOME
          fi
          mkdir -p internal/androidvpn/kotlin/libs
          git clone --depth 1 --branch "${ver}" https://github.com/SagerNet/sing-box.git "${RUNNER_TEMP}/sing-box"
          (
            cd "${RUNNER_TEMP}/sing-box"
            gomobile bind -v \
              -o "${GITHUB_WORKSPACE}/internal/androidvpn/kotlin/libs/libbox.aar" \
              -target android/arm64 \
              -androidapi 26 \
              -javapkg=io.nekohasekai \
              -libname=box \
              -trimpath -buildvcs=false \
              -ldflags "-X github.com/sagernet/sing-box/constant.Version=${ver#v} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
              -tags "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
              ./experimental/libbox
          )

      - name: Build Android APK
        run: |
          set -euo pipefail
          mygo_ver="$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"
          go run "github.com/egoist/mygo/cmd/mygo@${mygo_ver}" build -platform android/arm64

      - name: Run Android Lint
        run: |
          set -euo pipefail
          ORG_GRADLE_PROJECT_mygoNativeModules="native-androidvpn|${GITHUB_WORKSPACE}/internal/androidvpn/kotlin" \
            .mygo/android/gradlew -p .mygo/android :native-androidvpn:lintRelease --console=plain
